<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbre des amis Steam</title>
<style>
	:root {
		color-scheme: dark;
		--ground: #0f1419;
		--panel: #172029;
		--line: #26333f;
		--text: #d8e2ea;
		--muted: #8ba0b1;
		--accent: #66c0f4;
		--ok: #6bd07f;
		--private: #e0a355;
		--failed: #e06666;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: var(--ground);
		color: var(--text);
		font: 14px/1.45 "Motiva Sans", "Segoe UI", system-ui, sans-serif;
	}
	header {
		display: flex;
		flex-wrap: wrap;
		gap: 12px;
		align-items: center;
		padding: 12px 16px;
		background: var(--panel);
		border-bottom: 1px solid var(--line);
	}
	h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
	.stat { color: var(--muted); font-size: 12px; }
	.stat b { color: var(--text); font-weight: 600; }
	input[type="search"] {
		background: #0d1216;
		border: 1px solid var(--line);
		border-radius: 3px;
		color: var(--text);
		padding: 6px 8px;
		min-width: 220px;
	}
	button {
		background: #24313d;
		border: 1px solid var(--line);
		border-radius: 3px;
		color: var(--text);
		cursor: pointer;
		padding: 6px 10px;
	}
	button:hover { background: #2d3d4b; }
	main { position: relative; height: calc(100vh - 53px); overflow: hidden; }
	canvas { display: block; width: 100%; height: 100%; cursor: grab; }
	canvas.dragging { cursor: grabbing; }
	aside {
		position: absolute;
		top: 12px;
		right: 12px;
		width: 250px;
		padding: 12px;
		background: var(--panel);
		border: 1px solid var(--line);
		border-radius: 4px;
	}
	aside.hidden { display: none; }
	aside h2 { font-size: 14px; margin: 0 0 6px; overflow-wrap: anywhere; }
	aside .face { width: 64px; height: 64px; border-radius: 4px; display: block; margin-bottom: 8px; }
	aside dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 12px; }
	aside dt { color: var(--muted); }
	aside dd { margin: 0; overflow-wrap: anywhere; }
	aside a { color: var(--accent); }
	.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
	.legend span::before {
		content: "";
		display: inline-block;
		width: 9px;
		height: 9px;
		border-radius: 50%;
		margin-right: 5px;
		background: currentColor;
	}
	.legend .ok { color: var(--ok); }
	.legend .private { color: var(--private); }
	.legend .failed { color: var(--failed); }
	.hint {
		position: absolute;
		left: 12px;
		bottom: 12px;
		font-size: 12px;
		color: var(--muted);
		background: rgba(15, 20, 25, 0.8);
		padding: 4px 8px;
		border-radius: 3px;
	}
</style>
</head>
<body>
<header>
	<h1>Arbre des amis Steam</h1>
	<span class="stat"><b id="stat-nodes">0</b> comptes</span>
	<span class="stat"><b id="stat-depth">0</b> niveaux</span>
	<span class="stat" id="stat-date"></span>
	<span class="legend">
		<span class="ok">public</span>
		<span class="private">prive</span>
		<span class="failed">echec</span>
	</span>
	<input type="search" id="search" placeholder="Chercher un pseudo ou un SteamID64">
	<button id="reset">Recentrer</button>
</header>
<main>
	<canvas id="canvas"></canvas>
	<aside id="details" class="hidden"></aside>
	<div class="hint" id="hint"></div>
</main>
<script id="tree-data" type="application/json">__TREE_DATA__</script>
<script>
/*
 * The whole tree is drawn on a canvas rather than as SVG elements: a walk can
 * carry thousands of accounts, and one DOM node per account (plus one image
 * each) makes panning crawl. Here a frame only touches what is on screen, and
 * avatars are fetched lazily for those same accounts.
 */
const DATA = JSON.parse(document.getElementById('tree-data').textContent);
const COLORS = { ok: '#6bd07f', private: '#e0a355', failed: '#e06666', pending: '#8ba0b1' };
const LABELS = { ok: 'public', private: 'prive', failed: 'echec', pending: 'en attente' };

/** Gap between two rings, and the arc a leaf needs to keep clear of its neighbour. */
const RING = 460;
const MIN_ARC = 150;
/** Below these zoom levels avatars and names are noise, and cost frames. */
const AVATAR_MIN_ZOOM = 0.28;
const LABEL_MIN_ZOOM = 0.42;

const byId = new Map(DATA.nodes.map((node) => [node.id, node]));
const children = new Map();
for (const edge of DATA.edges) {
	if (!byId.has(edge.from) || !byId.has(edge.to)) continue;
	if (!children.has(edge.from)) children.set(edge.from, []);
	children.get(edge.from).push(edge.to);
}

/**
 * Radial layout: leaves share the circle evenly, parents sit at the middle of
 * their subtree, and the first ring is pushed out far enough that a leaf's
 * slice is never narrower than MIN_ARC.
 */
function layout(rootId) {
	const spots = new Map();
	if (!byId.has(rootId)) return { spots: spots, extent: RING };

	// Iterative walk: a deep tree would blow a recursive one's stack.
	const order = [];
	const seen = new Set([rootId]);
	const stack = [rootId];
	while (stack.length) {
		const id = stack.pop();
		order.push(id);
		for (const kid of children.get(id) || []) {
			if (seen.has(kid)) continue;
			seen.add(kid);
			stack.push(kid);
		}
	}

	const kidsOf = new Map();
	for (const id of order) kidsOf.set(id, (children.get(id) || []).filter((kid) => seen.has(kid)));

	// Leaf counts, deepest first, so a parent's weight is ready when it is read.
	const weight = new Map();
	for (let i = order.length - 1; i >= 0; i--) {
		const id = order[i];
		const kids = kidsOf.get(id);
		let total = 0;
		for (const kid of kids) total += weight.get(kid) || 1;
		weight.set(id, kids.length === 0 ? 1 : total);
	}

	const leaves = weight.get(rootId) || 1;
	const firstRing = Math.max(RING, (leaves * MIN_ARC) / (Math.PI * 2));
	let extent = firstRing;

	const queue = [{ id: rootId, start: 0, end: Math.PI * 2, depth: 0 }];
	while (queue.length) {
		const item = queue.pop();
		const radius = item.depth === 0 ? 0 : firstRing + (item.depth - 1) * RING;
		const angle = (item.start + item.end) / 2;
		extent = Math.max(extent, radius);
		spots.set(item.id, {
			node: byId.get(item.id),
			x: Math.cos(angle) * radius,
			y: Math.sin(angle) * radius,
			radius: item.depth === 0 ? 34 : 22,
		});
		let cursor = item.start;
		for (const kid of kidsOf.get(item.id)) {
			const share = ((weight.get(kid) || 1) / (weight.get(item.id) || 1)) * (item.end - item.start);
			queue.push({ id: kid, start: cursor, end: cursor + share, depth: item.depth + 1 });
			cursor += share;
		}
	}
	return { spots: spots, extent: extent };
}

const { spots, extent } = layout(DATA.root);
const points = Array.from(spots.values());
const links = [];
for (const edge of DATA.edges) {
	const from = spots.get(edge.from);
	const to = spots.get(edge.to);
	if (from && to) links.push({ from: from, to: to });
}

const canvas = document.getElementById('canvas');
const context = canvas.getContext('2d');
const details = document.getElementById('details');
const hint = document.getElementById('hint');

let view = { x: 0, y: 0, scale: 0.5 };
let needle = '';
let selected = null;
let width = 0;
let height = 0;

/** Avatars are loaded only for accounts actually drawn, and only once. */
const avatars = new Map();
let redrawQueued = false;

function avatarFor(node) {
	if (!node.avatar) return null;
	let image = avatars.get(node.id);
	if (image === undefined) {
		image = new Image();
		image.decoding = 'async';
		image.referrerPolicy = 'no-referrer';
		image.onload = () => requestDraw();
		image.onerror = () => avatars.set(node.id, null);
		image.src = node.avatar;
		avatars.set(node.id, image);
	}
	return image && image.complete && image.naturalWidth > 0 ? image : null;
}

function resize() {
	const ratio = window.devicePixelRatio || 1;
	width = canvas.clientWidth;
	height = canvas.clientHeight;
	canvas.width = Math.round(width * ratio);
	canvas.height = Math.round(height * ratio);
	context.setTransform(ratio, 0, 0, ratio, 0, 0);
	requestDraw();
}

function requestDraw() {
	if (redrawQueued) return;
	redrawQueued = true;
	requestAnimationFrame(() => {
		redrawQueued = false;
		draw();
	});
}

function matches(node) {
	if (!needle) return false;
	return (node.name || '').toLowerCase().indexOf(needle) >= 0 || node.id.indexOf(needle) >= 0;
}

function draw() {
	context.fillStyle = '#0f1419';
	context.fillRect(0, 0, width, height);

	const scale = view.scale;
	const margin = 80;
	const toScreenX = (x) => view.x + x * scale;
	const toScreenY = (y) => view.y + y * scale;

	// Edges first, as one path: a single stroke for the whole ring structure.
	context.strokeStyle = '#33465a';
	context.lineWidth = Math.max(0.6, 1.2 * scale);
	context.beginPath();
	for (const link of links) {
		const x1 = toScreenX(link.from.x);
		const y1 = toScreenY(link.from.y);
		const x2 = toScreenX(link.to.x);
		const y2 = toScreenY(link.to.y);
		// Skip an edge whose bounding box misses the viewport entirely.
		if (Math.max(x1, x2) < -margin || Math.min(x1, x2) > width + margin) continue;
		if (Math.max(y1, y2) < -margin || Math.min(y1, y2) > height + margin) continue;
		context.moveTo(x1, y1);
		context.lineTo(x2, y2);
	}
	context.stroke();

	const withAvatars = scale >= AVATAR_MIN_ZOOM;
	const withLabels = scale >= LABEL_MIN_ZOOM;
	let drawn = 0;

	context.textAlign = 'center';
	context.textBaseline = 'top';
	context.font = '13px "Motiva Sans", "Segoe UI", system-ui, sans-serif';

	for (const spot of points) {
		const x = toScreenX(spot.x);
		const y = toScreenY(spot.y);
		const r = spot.radius * scale;
		if (x < -margin || x > width + margin || y < -margin || y > height + margin) continue;
		drawn++;

		const node = spot.node;
		const hit = matches(node);
		context.globalAlpha = needle && !hit ? 0.15 : 1;

		context.beginPath();
		context.arc(x, y, r, 0, Math.PI * 2);
		context.fillStyle = COLORS[node.status] || COLORS.pending;
		context.fill();

		if (withAvatars) {
			const image = avatarFor(node);
			if (image) {
				const inner = r - Math.max(1.5, r * 0.12);
				context.save();
				context.beginPath();
				context.arc(x, y, inner, 0, Math.PI * 2);
				context.clip();
				context.drawImage(image, x - inner, y - inner, inner * 2, inner * 2);
				context.restore();
			}
		}

		if (hit || node.id === selected) {
			context.strokeStyle = '#ffffff';
			context.lineWidth = 2;
			context.beginPath();
			context.arc(x, y, r + 2, 0, Math.PI * 2);
			context.stroke();
		}

		if (withLabels) {
			const text = node.name || node.id;
			context.lineWidth = 3;
			context.strokeStyle = '#0f1419';
			context.strokeText(text, x, y + r + 4);
			context.fillStyle = '#d8e2ea';
			context.fillText(text, x, y + r + 4);
		}
	}

	context.globalAlpha = 1;
	hint.textContent =
		drawn + ' comptes affiches sur ' + points.length +
		(withLabels ? '' : ' — zoome pour les pseudos');
}

function recenter() {
	// Frame the whole tree, whatever its size.
	const span = Math.max(extent * 2 + 200, 1);
	view.scale = Math.min(1, Math.min(width, height) / span);
	view.x = width / 2;
	view.y = height / 2;
	requestDraw();
}

function nodeAt(clientX, clientY) {
	const rect = canvas.getBoundingClientRect();
	const px = clientX - rect.left;
	const py = clientY - rect.top;
	let best = null;
	let bestDistance = Infinity;
	for (const spot of points) {
		const x = view.x + spot.x * view.scale;
		const y = view.y + spot.y * view.scale;
		const r = Math.max(spot.radius * view.scale, 6);
		const distance = (x - px) * (x - px) + (y - py) * (y - py);
		if (distance <= r * r && distance < bestDistance) {
			best = spot.node;
			bestDistance = distance;
		}
	}
	return best;
}

function select(node) {
	selected = node ? node.id : null;
	if (!node) {
		details.classList.add('hidden');
		requestDraw();
		return;
	}
	details.classList.remove('hidden');
	details.innerHTML =
		'<img class="face" alt="" hidden><h2></h2><dl>' +
		'<dt>SteamID64</dt><dd class="sid"></dd>' +
		'<dt>Niveau</dt><dd class="depth"></dd>' +
		'<dt>Amis</dt><dd class="friends"></dd>' +
		'<dt>Profil</dt><dd class="visibility"></dd>' +
		'</dl><p><a target="_blank" rel="noreferrer">Ouvrir le profil</a></p>';
	const face = details.querySelector('.face');
	if (node.avatar) {
		face.src = node.avatar;
		face.hidden = false;
	}
	details.querySelector('h2').textContent = node.name || node.id;
	details.querySelector('.sid').textContent = node.id;
	details.querySelector('.depth').textContent = String(node.depth);
	details.querySelector('.friends').textContent =
		node.friends === null || node.friends === undefined ? 'inconnu' : String(node.friends);
	details.querySelector('.visibility').textContent = LABELS[node.status] || node.status;
	details.querySelector('a').href = node.url || 'https://steamcommunity.com/profiles/' + node.id;
	requestDraw();
}

let drag = null;
canvas.addEventListener('pointerdown', (event) => {
	drag = { x: event.clientX - view.x, y: event.clientY - view.y, moved: 0 };
	canvas.classList.add('dragging');
	canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', (event) => {
	if (!drag) return;
	const nextX = event.clientX - drag.x;
	const nextY = event.clientY - drag.y;
	drag.moved += Math.abs(nextX - view.x) + Math.abs(nextY - view.y);
	view.x = nextX;
	view.y = nextY;
	requestDraw();
});
canvas.addEventListener('pointerup', (event) => {
	const wasDrag = drag && drag.moved > 4;
	drag = null;
	canvas.classList.remove('dragging');
	if (!wasDrag) select(nodeAt(event.clientX, event.clientY));
});
canvas.addEventListener('wheel', (event) => {
	event.preventDefault();
	const rect = canvas.getBoundingClientRect();
	const cx = event.clientX - rect.left;
	const cy = event.clientY - rect.top;
	const next = Math.min(4, Math.max(0.02, view.scale * (event.deltaY < 0 ? 1.15 : 1 / 1.15)));
	// Whatever sits under the cursor stays under the cursor.
	view.x = cx - ((cx - view.x) * next) / view.scale;
	view.y = cy - ((cy - view.y) * next) / view.scale;
	view.scale = next;
	requestDraw();
}, { passive: false });

const search = document.getElementById('search');
search.addEventListener('input', () => {
	needle = search.value.trim().toLowerCase();
	requestDraw();
});
document.getElementById('reset').addEventListener('click', recenter);
window.addEventListener('resize', () => {
	resize();
	requestDraw();
});

document.getElementById('stat-nodes').textContent = String(DATA.nodes.length);
document.getElementById('stat-depth').textContent =
	String(DATA.nodes.reduce((max, node) => Math.max(max, node.depth), 0));
document.getElementById('stat-date').textContent =
	DATA.generated_at ? 'exporte le ' + DATA.generated_at : '';

resize();
recenter();
</script>
</body>
</html>
